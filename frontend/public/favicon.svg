<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="470" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5A2B"/>
      <stop offset="0.5" stop-color="#F03A17"/>
      <stop offset="1" stop-color="#D4250A"/>
    </linearGradient>
    <linearGradient id="hornL" x1="120" y1="90" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9F0"/>
      <stop offset="1" stop-color="#EDE0C8"/>
    </linearGradient>
    <linearGradient id="hornR" x1="400" y1="80" x2="310" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9F0"/>
      <stop offset="1" stop-color="#EDE0C8"/>
    </linearGradient>
    <linearGradient id="head" x1="130" y1="150" x2="390" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6E3D2C"/>
      <stop offset="1" stop-color="#4A2418"/>
    </linearGradient>
    <linearGradient id="snout" x1="200" y1="310" x2="320" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7CE9F"/>
      <stop offset="1" stop-color="#E2A76E"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.25" r="0.6" gradientUnits="objectBoundingBox">
      <stop stop-color="#FF8A50" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF8A50" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="12" y="12" width="488" height="488" rx="118" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="118" fill="url(#shine)"/>
  <!-- subtle inner border -->
  <rect x="22" y="22" width="468" height="468" rx="110" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" fill="none"/>

  <!-- Left ear (sticking out) -->
  <ellipse cx="130" cy="295" rx="58" ry="36" transform="rotate(-30 130 295)" fill="#5A3020"/>
  <ellipse cx="130" cy="295" rx="40" ry="22" transform="rotate(-30 130 295)" fill="#4A2418" opacity="0.5"/>

  <!-- Right ear (behind head, subtle) -->
  <ellipse cx="385" cy="275" rx="48" ry="30" transform="rotate(20 385 275)" fill="#5A3020"/>

  <!-- Left horn — curves up and left -->
  <path d="M195 215
           C175 155 140 105 105 90
           C78 78 58 95 72 120
           C95 165 130 210 170 248
           C188 265 210 250 195 215Z"
        fill="url(#hornL)"/>
  <!-- Left horn highlight -->
  <path d="M170 200 C155 160 130 125 105 110" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Right horn — curves up and right -->
  <path d="M318 210
           C338 150 375 100 410 85
           C438 73 458 90 444 115
           C420 160 385 205 345 243
           C327 260 303 245 318 210Z"
        fill="url(#hornR)"/>
  <!-- Right horn highlight -->
  <path d="M345 195 C360 155 385 120 410 105" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Head — wide rounded -->
  <ellipse cx="256" cy="300" rx="155" ry="155" fill="url(#head)"/>
  <!-- Forehead highlight -->
  <ellipse cx="256" cy="240" rx="110" ry="70" fill="#7A4832" opacity="0.35" filter="url(#soft)"/>

  <!-- Snout -->
  <ellipse cx="256" cy="390" rx="98" ry="78" fill="url(#snout)"/>
  <!-- Snout top highlight -->
  <ellipse cx="256" cy="355" rx="70" ry="30" fill="#FAD9B0" opacity="0.5"/>

  <!-- Nostrils -->
  <ellipse cx="222" cy="378" rx="15" ry="22" fill="#3D1F12"/>
  <ellipse cx="290" cy="378" rx="15" ry="22" fill="#3D1F12"/>
  <!-- Nostril highlights -->
  <ellipse cx="218" cy="370" rx="4" ry="6" fill="#5A3020" opacity="0.4"/>
  <ellipse cx="286" cy="370" rx="4" ry="6" fill="#5A3020" opacity="0.4"/>

  <!-- Left eye — open, cute -->
  <ellipse cx="192" cy="288" rx="34" ry="40" fill="white"/>
  <ellipse cx="197" cy="292" rx="22" ry="28" fill="#1A1A1A"/>
  <ellipse cx="205" cy="280" rx="10" ry="12" fill="white"/>
  <ellipse cx="190" cy="305" rx="5" ry="6" fill="white" opacity="0.55"/>

  <!-- Right eye — wink -->
  <path d="M292 292 Q318 268 346 296" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" fill="none"/>
  <!-- Wink lash accent -->
  <path d="M340 288 Q350 282 355 286" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Yellow accent dashes (right side) -->
  <rect x="398" y="248" width="54" height="15" rx="7.5" transform="rotate(-18 398 248)" fill="#F5B731"/>
  <rect x="408" y="298" width="44" height="15" rx="7.5" transform="rotate(-18 408 298)" fill="#F5B731"/>
  <rect x="404" y="342" width="30" height="13" rx="6.5" transform="rotate(-18 404 342)" fill="#F5B731" opacity="0.65"/>
</svg>
