<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 880" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="880" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4D1A"/>
      <stop offset="1" stop-color="#E8300A"/>
    </linearGradient>
    <linearGradient id="hornCream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF5"/>
      <stop offset="1" stop-color="#F0E4CC"/>
    </linearGradient>
    <linearGradient id="headBrown" x1="200" y1="200" x2="600" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6B3828"/>
      <stop offset="1" stop-color="#4E2518"/>
    </linearGradient>
    <linearGradient id="snoutTan" x1="350" y1="520" x2="500" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5C89A"/>
      <stop offset="1" stop-color="#E0A66A"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.3" cy="0.2" r="0.8" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FF6A30" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF6A30" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Red rounded-square app-icon background -->
  <rect x="0" y="0" width="880" height="880" rx="200" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="880" height="880" rx="200" fill="url(#bgGlow)"/>
  <!-- soft white inner edge -->
  <rect x="8" y="8" width="864" height="864" rx="196" stroke="#fff" stroke-opacity="0.15" stroke-width="6" fill="none"/>

  <!-- ===== EARS ===== -->
  <!-- Left ear -->
  <ellipse cx="175" cy="470" rx="100" ry="58" transform="rotate(-28 175 470)" fill="#5C2E1E"/>
  <ellipse cx="185" cy="468" rx="65" ry="32" transform="rotate(-28 185 468)" fill="#4A2214" opacity="0.6"/>
  <!-- Right ear (peeking) -->
  <ellipse cx="680" cy="420" rx="85" ry="50" transform="rotate(18 680 420)" fill="#5C2E1E"/>

  <!-- ===== HORNS ===== -->
  <!-- Left horn: thick, curves up-left, rounded tip -->
  <path d="M310 340
           C295 260 250 175 195 135
           C145 100 95 105 80 155
           C65 205 110 300 180 380
           C225 430 295 425 320 370
           C330 350 325 345 310 340Z"
        fill="url(#hornCream)"/>
  <!-- Left horn inner shade -->
  <path d="M280 320 C270 260 240 200 200 170" stroke="#E8D8B8" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Right horn: thick, curves up-right, rounded tip -->
  <path d="M570 330
           C585 250 630 165 685 125
           C735 90 785 95 800 145
           C815 195 770 290 700 370
           C655 420 585 415 560 360
           C550 340 555 335 570 330Z"
        fill="url(#hornCream)"/>
  <!-- Right horn inner shade -->
  <path d="M600 310 C610 250 640 190 680 160" stroke="#E8D8B8" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- ===== HEAD ===== -->
  <ellipse cx="440" cy="470" rx="260" ry="255" fill="url(#headBrown)"/>
  <!-- Forehead lighter patch -->
  <ellipse cx="440" cy="370" rx="185" ry="115" fill="#7A4430" opacity="0.35" filter="url(#blur1)"/>

  <!-- ===== SNOUT ===== -->
  <ellipse cx="440" cy="620" rx="168" ry="130" fill="url(#snoutTan)"/>
  <!-- snout top light -->
  <ellipse cx="440" cy="565" rx="120" ry="55" fill="#FAD9B0" opacity="0.45"/>

  <!-- Nostrils -->
  <ellipse cx="380" cy="605" rx="26" ry="38" fill="#3A1C10"/>
  <ellipse cx="500" cy="605" rx="26" ry="38" fill="#3A1C10"/>

  <!-- ===== LEFT EYE (open) ===== -->
  <ellipse cx="330" cy="475" rx="58" ry="68" fill="white"/>
  <ellipse cx="338" cy="482" rx="38" ry="48" fill="#111"/>
  <ellipse cx="352" cy="460" rx="16" ry="20" fill="white"/>
  <ellipse cx="325" cy="510" rx="8" ry="10" fill="white" opacity="0.5"/>

  <!-- ===== RIGHT EYE (wink) ===== -->
  <!-- main wink arc -->
  <path d="M530 485 Q578 440 628 490" stroke="#111" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- tiny lash flick -->
  <path d="M618 478 Q634 468 642 475" stroke="#111" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- ===== YELLOW ACCENT DASHES (right) ===== -->
  <rect x="718" y="400" width="90" height="24" rx="12" transform="rotate(-22 718 400)" fill="#F5B520"/>
  <rect x="735" y="480" width="72" height="24" rx="12" transform="rotate(-22 735 480)" fill="#F5B520"/>
  <rect x="728" y="550" width="50" height="20" rx="10" transform="rotate(-22 728 550)" fill="#F5B520" opacity="0.7"/>
</svg>
